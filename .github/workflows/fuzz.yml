name: Scheduled fuzzing

on:
  workflow_call:
    inputs:
      bounded:
        type: boolean
        default: false
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: Fuzzing seconds
        type: choice
        options: ['30', '60', '300']
        default: '60'

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FUZZ_TOOLCHAIN: nightly-2026-11-23
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned fuzz toolchain
        run: rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
      - name: Cache cargo-fuzz
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-fuzz-tool
          key: cargo-fuzz-${{ runner.os }}-${{ runner.arch }}-0.13.2-${{ env.FUZZ_TOOLCHAIN }}
      - name: Install cargo-fuzz
        shell: bash
        run: |
          tool_root="$RUNNER_TEMP/cargo-fuzz-tool"
          if [[ ! -x "$tool_root/bin/cargo-fuzz" ]]; then
            cargo +"$FUZZ_TOOLCHAIN" install cargo-fuzz --version 0.13.2 --locked --root "$tool_root"
          fi
          printf '%s\n' "$tool_root/bin" >> "$GITHUB_PATH"
      - name: Restore and retain corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Fuzz coverage against the exhaustive oracle
        env:
          BOUNDED: ${{ inputs.bounded || false }}
          FUZZ_SECONDS: ${{ inputs.seconds || '60' }}
        shell: bash
        run: |
          seed=$(( GITHUB_RUN_ID % 2147483647 + 1 ))
          if [[ "$BOUNDED" == true ]]; then
            budget='-runs=1000'
          else
            budget="-max_total_time=$FUZZ_SECONDS"
          fi
          cargo +"$FUZZ_TOOLCHAIN" fuzz run coverage -- "$budget" "-seed=$seed" 2>&1 |
            tee "$RUNNER_TEMP/coverage-fuzz.log"
          git diff --exit-code -- fuzz/Cargo.lock
      - name: Preserve fuzz diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-fuzz-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/coverage-fuzz.log
            fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 14
